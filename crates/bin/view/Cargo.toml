[package]
name = "view"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
kajiya = { path = "../../lib/kajiya" }
kajiya-simple = { path = "../../lib/kajiya-simple", features = ["dear-imgui", "winit_serde"] }
kajiya-asset-pipe = { path = "../../lib/kajiya-asset-pipe"}

anyhow = "1.0"
dolly = { git = "https://github.com/josecegri/dolly.git" }
imgui = "0.12.0"
log = "0.4"
ron = "0.12.1"
serde = { version = "1.0", features = ["derive"] }
serde_plain = "1.0.2"
structopt = "0.3.2"
toml = "0.7.2"
splines = { version = "5.0.0", features = ["glam"] }

[features]
dlss = ["kajiya/dlss"]
puffin-server = ['kajiya-simple/puffin-server']
