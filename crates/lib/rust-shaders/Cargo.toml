[package]
name = "rust-shaders"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "dylib"]
test = false
doctest = false

[dependencies]
rust-shaders-shared = { path = "../rust-shaders-shared" }
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "eb73c07837c31b4eca701237e04ef1a46432e57b" }
glam = { version = "0.33.5", default-features = false, features = ["libm"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(spirv)"] }
