[package]
name = "kajiya-backend"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
arrayvec = "0.5"
ash = { version = "0.38.0", default-features = false, features = ["linked"]}
ash-window = "0.13.0"
backtrace = "0.3"
byte-slice-cast = "0.3"
bytes = "1.0"
derive_builder = { version = "0.9", default-features = false }
futures = "0.3"
glam = "0.22"
gpu-allocator = "0.28.0"
gpu-profiler = { git = "https://github.com/h3r2tic/gpu-profiler.git", rev = "1ad89f9f2ddcd34e4a5f37bc85233adfe7baad56", features = ["use-ash"] }
hassle-rs = "0.12.0"
hotwatch = "0.4"
log = "0.4"
nanoserde = "0.2.1"
normpath = "0.3"
parking_lot = "0.11"
puffin = "0.11.0"
raw-window-handle = "0.6.2"
relative-path = "1.3"
rspirv = "0.13.0"
rspirv-reflect = "0.9.0"
shader-prepper = "0.3.0-pre.1"
smol = "1.2.5"
thiserror = "1.0"
turbosloth = { git = "https://github.com/h3r2tic/turbosloth.git", rev = "92030af" }
vk-sync = { git = "https://github.com/josecegri/vk-sync-rs", rev = "911eb21219c192e3be241fcbe716efd0adaaff33" }

[features]
#default = []
dlss = []
