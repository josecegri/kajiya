[package]
name = "rust-shaders-shared"
version = "0.1.0"
edition = "2024"

[lib]
test = false
doctest = false

[dependencies]
glam = { version = "0.33.5", default-features = false, features = ["libm", "i32", "u32"] }

[target.'cfg(target_arch = "spirv")'.dependencies]
spirv-std = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "eb73c07837c31b4eca701237e04ef1a46432e57b" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(spirv)"] }
